name: build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flet==0.28.3
      - run: rm -rf build
      - run: yes | flet build apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk
